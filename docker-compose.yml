services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: selfprint
      POSTGRES_PASSWORD: selfprint
      POSTGRES_DB: selfprint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfprint -d selfprint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
